<!DOCTYPE html>
<html>
<head>
<title>SafeSignal AI Security</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#050a18;
    font-family:Orbitron;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    font-size:28px;
    letter-spacing:2px;
    color:#00ffe7;
    text-shadow:0 0 10px #00ffe7;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-gap:20px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,255,200,0.3);
    border-radius:12px;
    padding:15px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 15px rgba(0,255,200,0.2);
}

.card h2{
    margin-top:0;
    color:#00ffe7;
}

.video{
    width:100%;
    border-radius:10px;
}

.map{
    width:100%;
    height:300px;
    border-radius:10px;
}

.status{
    font-size:24px;
    color:#00ff84;
    text-shadow:0 0 10px #00ff84;
}

.threat{
    text-align:center;
    font-size:20px;
    margin-top:20px;
}

.bar{
    width:100%;
    height:15px;
    background:#222;
    border-radius:10px;
    margin-top:10px;
}

.level{
    height:100%;
    width:30%;
    background:#00ff84;
    box-shadow:0 0 10px #00ff84;
    border-radius:10px;
}

.logs{
    margin-top:10px;
    font-size:14px;
    color:#aaa;
}

</style>
</head>

<body>

<header>
SAFE SIGNAL – AI SECURITY SYSTEM
</header>

<div class="dashboard">

<div class="card">
<h2>Live Camera Feed</h2>
<img src="/video_feed" class="video">
</div>

<div class="card">
<h2>Location</h2>

<div class="map-container">
<iframe
src="https://maps.google.com/maps?q=23.0,88.0&z=15&output=embed"
allowfullscreen>
</iframe>
</div>

</div>

</div>

<div class="card">
<h2>Latest Evidence</h2>
<img src="/latest_evidence" class="video">
</div>

<div class="card">
<h2>Alert Status</h2>

<div class="status">
SYSTEM NORMAL
</div>

<div class="threat">
Threat Level
<div class="bar">
<div class="level"></div>
</div>
</div>

<div class="logs">
Event Logs<br>
• System started<br>
• Camera active
</div>

</div>

</div>

</body>
</html>
